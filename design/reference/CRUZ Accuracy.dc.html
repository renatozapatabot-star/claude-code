<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --app-bg:#0B1622; --surface:#0D1722; --surface-raised:#13212E; --surface-sunken:#0A1019;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.14); --text-strong:#E9F1F7; --text:#CDD8E3; --text-muted:#8295A8;
    --accent:#22D3EE; --accent-text:#5FD8EC; --success:#34D399; --success-bg:rgba(52,211,153,.12); --success-line:rgba(52,211,153,.3);
    --warning:#FBBF24; --warning-bg:rgba(245,158,11,.13); --danger:#FB7185; --danger-bg:rgba(244,63,94,.13);
    --mono:'Space Mono',monospace; --sans:'Hanken Grotesk',system-ui,sans-serif; --display:'Archivo',sans-serif; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  :focus-visible{outline:none;box-shadow:0 0 0 2px var(--app-bg),0 0 0 4px var(--accent);border-radius:8px;transition:box-shadow .15s ease;}
  @keyframes ac_rise{from{transform:translateY(10px);}to{transform:none;}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;}}
</style>
</helmet>
<div style="min-height:100vh;background:var(--app-bg);color:var(--text);font-family:var(--sans);padding:30px 20px 60px;">
  <div style="max-width:760px;margin:0 auto;">

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
      <span style="width:30px;height:30px;border-radius:8px;background:#0E7490;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:#fff;">C</span>
      <span style="font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text);font-family:var(--mono);">{{ t.eyebrow }}</span>
      <div style="margin-left:auto;display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--surface-sunken);border:1px solid var(--border);">
        <button onClick="{{ setEs }}" style="border:none;border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;background:{{ esBg }};color:{{ esColor }};font-family:var(--sans);">ES</button>
        <button onClick="{{ setEn }}" style="border:none;border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;background:{{ enBg }};color:{{ enColor }};font-family:var(--sans);">EN</button>
      </div>
    </div>
    <h1 style="font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:26px;line-height:1.15;color:var(--text-strong);margin:0 0 6px;">{{ t.title }}</h1>
    <div style="font-size:13.5px;color:var(--text-muted);line-height:1.5;margin-bottom:22px;">{{ t.sub }}</div>

    <!-- HERO: frequency form first, % last -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;animation:ac_rise .4s ease both;">
      <div style="font-size:13px;color:var(--text-muted);">{{ t.heroLead }}</div>
      <div style="font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:30px;color:var(--text-strong);margin:8px 0;line-height:1.1;">{{ t.heroFreq }}</div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <span style="font-family:var(--mono);font-size:13px;color:var(--success);font-weight:700;">99.3%</span>
        <span style="font-size:12px;color:var(--text-muted);font-family:var(--mono);">{{ t.window }}</span>
        <span style="font-size:12px;color:var(--text-muted);font-family:var(--mono);">n = 9,920</span>
        <a href="#" onClick="{{ stop }}" style="margin-left:auto;font-size:12px;font-weight:600;color:var(--accent-text);text-decoration:none;display:inline-flex;align-items:center;gap:5px;">{{ t.reproLink }}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M9 7h8v8"/></svg></a>
      </div>
    </div>

    <!-- coverage -> dollars curve -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-top:14px;animation:ac_rise .5s ease both;">
      <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;">{{ t.curveTitle }}</div>
      <div style="font-size:12.5px;color:var(--text-muted);line-height:1.5;margin-bottom:16px;">{{ t.curveSub }}</div>
      <svg viewBox="0 0 600 220" style="width:100%;height:auto;display:block;" preserveAspectRatio="none" role="img" aria-label="{{ t.curveTitle }}">
        <defs><linearGradient id="acg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient></defs>
        <line x1="40" y1="186" x2="588" y2="186" stroke="#22303D" stroke-width="1"/>
        <line x1="40" y1="20" x2="40" y2="186" stroke="#22303D" stroke-width="1"/>
        <path d="M40 180 C 150 176, 250 150, 330 112 S 500 36, 588 26 L 588 186 L 40 186 Z" fill="url(#acg)"/>
        <path d="M40 180 C 150 176, 250 150, 330 112 S 500 36, 588 26" fill="none" stroke="#22D3EE" stroke-width="2.5"/>
        <circle cx="330" cy="112" r="4.5" fill="#0B1622" stroke="#22D3EE" stroke-width="2.5"/>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-muted);font-family:var(--mono);margin-top:6px;">
        <span>{{ t.axX }}</span><span>{{ t.axY }}</span>
      </div>
    </div>

    <!-- confidence buckets -> action -->
    <div style="margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;animation:ac_rise .55s ease both;">
      <sc-for list="{{ buckets }}" as="b" hint-placeholder-count="3">
        <div style="background:var(--surface);border:1px solid {{ b.line }};border-radius:15px;padding:16px;">
          <div style="display:flex;align-items:center;gap:7px;"><span style="width:9px;height:9px;border-radius:3px;background:{{ b.color }};"></span><span style="font-size:12px;font-weight:800;color:{{ b.color }};letter-spacing:.02em;">{{ b.tier }}</span></div>
          <div style="font-family:var(--mono);font-size:22px;font-weight:700;color:var(--text-strong);margin:10px 0 2px;">{{ b.pct }}</div>
          <div style="font-size:11.5px;color:var(--text-muted);line-height:1.4;">{{ b.action }}</div>
        </div>
      </sc-for>
    </div>

    <div style="margin-top:16px;display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:13px;background:var(--surface-sunken);border:1px solid var(--border);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" style="flex:0 0 16px;margin-top:1px;"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 8v4M12 16h.01"/></svg>
      <span style="font-size:12.5px;color:var(--text);line-height:1.55;">{{ t.honest }}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:820}}">
class Component extends DCLogic {
  state = { lang:'es' };
  componentDidMount(){ try{ const l=localStorage.getItem('cruz.lang'); if(l)this.setState({lang:l}); }catch(e){} }
  setEs=()=>{ try{localStorage.setItem('cruz.lang','es');}catch(e){} this.setState({lang:'es'}); };
  setEn=()=>{ try{localStorage.setItem('cruz.lang','en');}catch(e){} this.setState({lang:'en'}); };
  stop=(e)=>{ try{e.preventDefault();}catch(_){ } };
  renderVals(){
    const es=this.state.lang!=='en'; const A=(en,e)=>es?e:en;
    const seg=(on)=>({bg:on?'var(--surface)':'transparent',color:on?'var(--accent-text)':'var(--text-muted)'});
    const e=seg(es), n=seg(!es);
    const t={
      eyebrow:A('Measured in the open','Medido a la vista'),
      title:A('We publish the denominator nobody else will.','Publicamos el denominador que nadie más muestra.'),
      sub:A('Accuracy with its sample size, framed as a human outcome — not a marketing number.','Precisión con su tamaño de muestra, expresada como resultado humano — no un número de marketing.'),
      heroLead:A('Against the licensed broker\u2019s own filing, last 30 days:','Contra la propia presentación del agente, últimos 30 días:'),
      heroFreq:A('Matched in 9,847 of 9,920 fields','Coincidió en 9,847 de 9,920 campos'),
      window:A('30-day window','ventana 30 días'),
      reproLink:A('Reproduce this measurement','Reproducir esta medición'),
      curveTitle:A('Coverage → dollars touched','Cobertura → dólares cubiertos'),
      curveSub:A('As auto-handled coverage rises, the landed-cost / duty dollars CRUZ touches rises with it. The point marks today.','Conforme sube la cobertura automática, suben los dólares de costo/contribuciones que CRUZ cubre. El punto marca hoy.'),
      axX:A('auto-handled coverage →','cobertura automática →'),
      axY:A('↑ USD touched / month','↑ USD cubiertos / mes'),
      honest:A('High/Med/Low isn\u2019t cosmetic — each tier routes to an action. We never show a fake 0% or a number without its denominator.','Alto/Medio/Bajo no es cosmético — cada nivel enruta a una acción. Nunca mostramos un 0% falso ni un número sin su denominador.'),
    };
    const buckets=[
      {tier:A('HIGH','ALTO'),pct:'78%',action:A('Mechanical — auto-run, logged for review.','Mecánico — auto-ejecuta, registrado.'),color:'var(--success)',line:'var(--success-line)'},
      {tier:A('MEDIUM','MEDIO'),pct:'17%',action:A('Flagged — operator confirms.','Marcado — el operador confirma.'),color:'var(--warning)',line:'rgba(245,158,11,.3)'},
      {tier:A('LOW','BAJO'),pct:'5%',action:A('Routed to the licensed broker.','Enrutado al agente con patente.'),color:'var(--danger)',line:'rgba(244,63,94,.3)'},
    ];
    return { t, buckets, setEs:this.setEs, setEn:this.setEn, stop:this.stop, esBg:e.bg,esColor:e.color, enBg:n.bg,enColor:n.color };
  }
}
</script>
</body>
</html>
