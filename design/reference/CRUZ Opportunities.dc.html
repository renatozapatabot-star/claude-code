<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --app-bg:#0B1622; --surface:#0D1722; --surface-raised:#13212E; --surface-sunken:#0A1019;
    --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.14); --text-strong:#E9F1F7; --text:#CDD8E3; --text-muted:#8295A8;
    --accent:#22D3EE; --accent-text:#5FD8EC; --accent-solid:#0E7490; --success:#34D399; --success-bg:rgba(52,211,153,.12); --success-line:rgba(52,211,153,.3);
    --warning:#FBBF24; --warning-bg:rgba(245,158,11,.13); --warning-line:rgba(245,158,11,.3); --danger:#FB7185; --danger-bg:rgba(244,63,94,.13); --danger-line:rgba(244,63,94,.3);
    --mono:'Space Mono',monospace; --sans:'Hanken Grotesk',system-ui,sans-serif; --display:'Archivo',sans-serif; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  :focus-visible{outline:none;box-shadow:0 0 0 2px var(--app-bg),0 0 0 4px var(--accent);border-radius:8px;transition:box-shadow .15s ease;}
  @keyframes op_rise{from{transform:translateY(10px);}to{transform:none;}}
  @keyframes op_exp{from{opacity:.4;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;}}
</style>
</helmet>
<div style="min-height:100vh;background:var(--app-bg);color:var(--text);font-family:var(--sans);padding:30px 20px 60px;">
  <div style="max-width:760px;margin:0 auto;">

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
      <span style="width:30px;height:30px;border-radius:8px;background:var(--accent-solid);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:#fff;">C</span>
      <span style="font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text);font-family:var(--mono);">{{ t.eyebrow }}</span>
      <div style="margin-left:auto;display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--surface-sunken);border:1px solid var(--border);">
        <button onClick="{{ setEs }}" style="border:none;border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;background:{{ esBg }};color:{{ esColor }};font-family:var(--sans);">ES</button>
        <button onClick="{{ setEn }}" style="border:none;border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;background:{{ enBg }};color:{{ enColor }};font-family:var(--sans);">EN</button>
      </div>
    </div>
    <h1 style="font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:26px;line-height:1.15;color:var(--text-strong);margin:0 0 6px;">{{ t.title }}</h1>
    <div style="font-size:13.5px;color:var(--text-muted);line-height:1.5;margin-bottom:22px;">{{ t.sub }}</div>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <sc-for list="{{ opps }}" as="o" hint-placeholder-count="3">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;animation:op_rise .4s ease both;">
          <div style="padding:18px 20px;">
            <div style="display:flex;align-items:flex-start;gap:14px;">
              <span style="width:38px;height:38px;border-radius:11px;background:var(--success-bg);border:1px solid var(--success-line);display:flex;align-items:center;justify-content:center;flex:0 0 38px;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:15px;font-weight:700;color:var(--text-strong);line-height:1.3;">{{ o.title }}</div>
                <div style="font-size:12.5px;color:var(--text-muted);line-height:1.5;margin-top:4px;">{{ o.body }}</div>
                <div style="font-size:11px;color:var(--accent-text);font-family:var(--mono);margin-top:7px;">{{ o.cite }}</div>
              </div>
              <div style="text-align:right;flex:0 0 auto;">
                <div style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--success);">{{ o.value }}</div>
                <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;">{{ o.valueLabel }}</div>
              </div>
            </div>
            <button onClick="{{ o.toggle }}" style="margin-top:14px;height:38px;padding:0 16px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-raised);color:var(--text-strong);font-family:var(--sans);font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;">{{ o.cta }}<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="transform:{{ o.chev }};"><path d="M6 9l6 6 6-6"/></svg></button>
          </div>
          <!-- editable plan-then-execute -->
          <sc-if value="{{ o.open }}" hint-placeholder-val="{{ false }}">
          <div style="padding:16px 20px;border-top:1px solid var(--border);background:var(--surface-sunken);animation:op_exp .25s ease both;">
            <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;">{{ t.planTitle }}</div>
            <div style="font-size:12px;color:var(--text-muted);line-height:1.5;margin-bottom:12px;">{{ t.planSub }}</div>
            <div style="display:flex;flex-direction:column;gap:7px;">
              <sc-for list="{{ o.plan }}" as="p" hint-placeholder-count="4">
                <div style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid {{ p.line }};">
                  <span style="width:22px;height:22px;flex:0 0 22px;border-radius:7px;background:{{ p.numBg }};display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;color:{{ p.numColor }};">{{ p.n }}</span>
                  <span style="flex:1;font-size:13px;color:{{ p.textColor }};text-decoration:{{ p.strike }};">{{ p.label }}</span>
                  <sc-if value="{{ p.gated }}" hint-placeholder-val="{{ false }}"><span style="font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--danger);background:var(--danger-bg);border:1px solid var(--danger-line);border-radius:6px;padding:2px 7px;">{{ t.gate }}</span></sc-if>
                  <sc-if value="{{ p.removable }}" hint-placeholder-val="{{ true }}"><button onClick="{{ p.toggle }}" title="{{ p.toggleTitle }}" style="width:26px;height:26px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 26px;">{{ p.icon }}</button></sc-if>
                </div>
              </sc-for>
            </div>
            <button onClick="{{ o.run }}" style="width:100%;margin-top:14px;height:46px;border:none;border-radius:12px;background:var(--accent-solid);color:#fff;font-family:var(--display);font-size:14px;font-weight:800;cursor:pointer;">{{ o.runLabel }}</button>
            <div style="text-align:center;font-size:11px;color:var(--text-muted);margin-top:9px;">{{ t.runNote }}</div>
          </div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="margin-top:16px;display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:13px;background:var(--surface-sunken);border:1px solid var(--border);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" style="flex:0 0 16px;margin-top:1px;"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 8v4M12 16h.01"/></svg>
      <span style="font-size:12.5px;color:var(--text);line-height:1.55;">{{ t.honest }}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { lang:'es', open:{}, removed:{} };
  componentDidMount(){ try{ const l=localStorage.getItem('cruz.lang'); if(l)this.setState({lang:l}); }catch(e){} }
  setEs=()=>{ try{localStorage.setItem('cruz.lang','es');}catch(e){} this.setState({lang:'es'}); };
  setEn=()=>{ try{localStorage.setItem('cruz.lang','en');}catch(e){} this.setState({lang:'en'}); };
  toggleOpp=(id)=>this.setState(s=>({open:Object.assign({},s.open,{[id]:!s.open[id]})}));
  toggleStep=(key)=>this.setState(s=>({removed:Object.assign({},s.removed,{[key]:!s.removed[key]})}));
  renderVals(){
    const es=this.state.lang!=='en'; const A=(en,e)=>es?e:en;
    const seg=(on)=>({bg:on?'var(--surface)':'transparent',color:on?'var(--accent-text)':'var(--text-muted)'});
    const e=seg(es), n=seg(!es);
    const minus=React.createElement('svg',{width:13,height:13,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.4},React.createElement('path',{d:'M5 12h14'}));
    const plus=React.createElement('svg',{width:13,height:13,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.4},React.createElement('path',{d:'M12 5v14M5 12h14'}));
    const OPPS=[
      {id:'o1', title:A('$12,440 in recoverable duty across 4 loads','$12,440 en contribuciones recuperables en 4 embarques'),
        body:A('These loads paid MFN rates; they qualify for T-MEC preference. CRUZ can prepare amended entries.','Estos embarques pagaron tasa MFN; califican para preferencia T-MEC. CRUZ puede preparar rectificaciones.'),
        cite:A('Evidence: 4 paid pedimentos · TIGIE 8708.99.05 · T-MEC Art 4.2','Evidencia: 4 pedimentos pagados · TIGIE 8708.99.05 · T-MEC Art 4.2'), value:'$12,440',
        plan:[ [A('Pull the 4 paid pedimentos','Traer los 4 pedimentos pagados'),false], [A('Re-validate origin under T-MEC','Re-validar origen bajo T-MEC'),false], [A('Draft 4 amended entries (rectificación)','Redactar 4 rectificaciones'),false], [A('Queue for broker signature','Encolar para firma del agente'),true] ]},
      {id:'o2', title:A('Fracción reclassification saves ~$3,180 / yr','Reclasificación de fracción ahorra ~$3,180/año'),
        body:A('A recurring SKU is classified one tier high. A defensible reclassification lowers the IGI rate.','Un SKU recurrente está clasificado un nivel arriba. Una reclasificación defendible baja la tasa IGI.'),
        cite:A('Evidence: 18 entries · GRI 1 + GRI 6 · comparable rulings','Evidencia: 18 pedimentos · RGI 1 + RGI 6 · criterios comparables'), value:'$3,180',
        plan:[ [A('Assemble the comparable-entry evidence','Reunir evidencia de pedimentos comparables'),false], [A('Draft the reclassification memo','Redactar el memo de reclasificación'),false], [A('Route to broker for review','Enviar al agente para revisión'),true] ]},
      {id:'o3', title:A('2 IMMEX temporary imports expire in 11 days','2 importaciones temporales IMMEX vencen en 11 días'),
        body:A('Anexo 24 shows 2 entries nearing their return deadline. CRUZ can prepare the return filing or convert-to-definitive.','Anexo 24 muestra 2 entradas cerca del vencimiento. CRUZ puede preparar el retorno o cambio a definitivo.'),
        cite:A('Evidence: Anexo 24 · AX-972970, AX-972981 · America/Chicago','Evidencia: Anexo 24 · AX-972970, AX-972981 · America/Chicago'), value:'2 loads',
        plan:[ [A('Compute duty impact of each path','Calcular impacto de cada ruta'),false], [A('Draft return + convert-to-definitive options','Redactar retorno + cambio a definitivo'),false], [A('Present both to broker','Presentar ambas al agente'),true] ]},
    ];
    const opps=OPPS.map(o=>{
      const open=!!this.state.open[o.id];
      const plan=o.plan.map((p,i)=>{ const key=o.id+':'+i; const removed=!!this.state.removed[key]; const gated=p[1];
        return { n:i+1, label:p[0], gated, removable:!gated, toggle:()=>this.toggleStep(key), icon:removed?plus:minus, toggleTitle:removed?A('Add back','Reañadir'):A('Remove step','Quitar paso'),
          line:removed?'var(--border)':(gated?'var(--danger-line)':'var(--border)'), numBg:removed?'var(--surface-sunken)':'var(--surface-raised)', numColor:removed?'var(--text-muted)':'var(--accent-text)',
          textColor:removed?'var(--text-muted)':'var(--text-strong)', strike:removed?'line-through':'none' }; });
      return { ...o, valueLabel:A('est. value','valor est.'), cta:open?A('Hide plan','Ocultar plan'):A('Review the plan','Revisar el plan'), chev:open?'rotate(180deg)':'none',
        open, toggle:()=>this.toggleOpp(o.id), plan, run:()=>{}, runLabel:A('Run plan (stops at the signature)','Ejecutar plan (se detiene en la firma)') };
    });
    const t={
      eyebrow:A('Opportunities · pull, not push','Oportunidades · jalar, no empujar'),
      title:A('CRUZ found money and risk in your own data.','CRUZ encontró dinero y riesgo en tus propios datos.'),
      sub:A('Evidence-backed, dollar-valued findings you pull on your cadence — no notifications, no badge spam, no nagging.','Hallazgos con evidencia y valor en dólares que jalas a tu ritmo — sin notificaciones, sin insignias, sin molestar.'),
      planTitle:A('The plan is the contract — edit it before it runs','El plan es el contrato — edítalo antes de ejecutar'),
      planSub:A('Remove any step. The agent executes exactly what you approve, and stops at the licensed signature.','Quita cualquier paso. El agente ejecuta exactamente lo que apruebas, y se detiene en la firma con patente.'),
      gate:A('Hard-gate','Compuerta'),
      runNote:A('Nothing files or pays. Every step is logged and reversible up to the broker signature.','Nada se presenta ni paga. Cada paso queda registrado y es reversible hasta la firma del agente.'),
      honest:A('Findings never push themselves at you. They wait here, valued and cited, until you choose to act — and the plan is always yours to edit first.','Los hallazgos nunca se te imponen. Esperan aquí, valuados y citados, hasta que decidas actuar — y el plan siempre es tuyo para editar primero.'),
    };
    return { t, opps, setEs:this.setEs, setEn:this.setEn, esBg:e.bg,esColor:e.color, enBg:n.bg,enColor:n.color };
  }
}
</script>
</body>
</html>
